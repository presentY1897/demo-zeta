name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에서 새 커밋이 오면 진행 중인 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 로컬 .env.example과 같은 구성 — CI에서는 서비스 컨테이너를 가리킨다
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/theta
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/theta_test
  E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/theta_e2e
  SESSION_SECRET: ci-session-secret
  ADMIN_PASSWORD: ci-admin-password

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: theta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 테스트용·E2E용 DB는 서비스 컨테이너가 만들어 주지 않으므로 직접 만든다
      # (로컬에서는 docker/init-test-db.sql이 하는 일)
      - name: 테스트 DB 생성
        run: |
          psql "postgres://postgres:postgres@localhost:5432/postgres" \
            -c 'CREATE DATABASE theta_test' -c 'CREATE DATABASE theta_e2e'

      - name: 타입체크
        run: pnpm typecheck

      - name: 유닛 · DB 통합 테스트
        run: pnpm test

      - name: 프로덕션 빌드
        run: pnpm build

      - name: Playwright 브라우저 설치
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E 스모크
        run: pnpm e2e

      - name: 실패 시 Playwright 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/.results/
          retention-days: 7
