# 프로젝트 이름 고정 — worktree 디렉터리가 달라도 같은 컨테이너/볼륨을 쓴다
name: theta

# 로컬 개발용 Postgres. Neon 계정 없이도 전 기능이 동작한다.
#   docker compose up -d && pnpm db:migrate && pnpm db:seed
services:
  db:
    image: postgres:16-alpine
    container_name: theta-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: theta
    ports:
      # 호스트 5433 — 5432는 다른 로컬 Postgres와 충돌하기 쉬워 비워 둔다
      - "5433:5432"
    volumes:
      - theta-db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d theta"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  theta-db-data:
